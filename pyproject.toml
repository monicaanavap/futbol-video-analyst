[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futbol-video-analyst"
version = "0.1.0"
description = "Automatic football match clipping and event tagging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
training = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futbol_video_analyst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
