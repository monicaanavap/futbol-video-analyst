[package]
name = "futbol-video-analyst"
version = "0.1.0"
description = "Local football video analysis"
authors = ["Futbol Video Analyst"]
edition = "2021"

[lib]
name = "futbol_video_analyst_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
